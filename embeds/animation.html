<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canvasplayer: Animation</title>
<meta name="description" content="A looping GML graffiti drawing. Reduced motion shows the finished tag instead.">
<meta name="robots" content="noindex,follow">
<style>
  html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
  .stage { width: 100%; height: 100%; }
  canvas { display: block; }
  #status {
    position: absolute; inset: 0; display: grid; place-items: center;
    margin: 0; padding: 24px; color: #aaa; text-align: center;
    font: 15px/1.5 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }
  #status[hidden] { display: none; }
</style>
<main>
<div class="stage"><canvas aria-label="Graffiti drawing" role="img"></canvas></div>
<p id="status" role="status">Loading tag</p>
</main>
<script type="module">
  import { parse, GmlPlayer } from '../gml-player.js';
  import { loadEmbedTag } from '../load-tag.js';

  const status = document.getElementById('status');
  try {
    const json = await loadEmbedTag();
    const tag = parse(json.gml, json.id);
    if (!tag.strokes.length) throw new Error('Tag #' + tag.id + ' has no stroke data');
    const canvas = document.querySelector('canvas');
    canvas.setAttribute('aria-label', 'Animated drawing from tag ' + tag.id);
    const player = new GmlPlayer(canvas, tag);
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const updateMotion = () => {
      if (motion.matches) {
        player.pause();
        player.seek(player.duration);
      } else player.play();
    };
    motion.addEventListener('change', updateMotion);
    updateMotion();
    status.hidden = true;
  } catch (error) {
    status.textContent = error.message;
  }
</script>

</html>
