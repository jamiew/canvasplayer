name: Pages

# Publishes every renderer from one site. Each lives on its own branch and
# shares gml.js; this assembles them into subfolders rather than merging
# them, so the branches stay independent:
#
#   /              main, the flat 2D canvas
#   /native-3d/    2D canvas with time as depth and the dust field
#   /threejs/      WebGL, after Evan Roth's 3D fork
#
# Everything is static, so there is no build step -- the copy is the build.
# Only main deploys: the github-pages environment is protected, and a run
# from any other branch is rejected before it can publish. That costs
# nothing, because this job checks out all three branches at their latest
# whenever it runs. After pushing a renderer branch, rebuild the site with
# `gh workflow run Pages --ref main`, or the Run workflow button.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: src/main

      # A renderer that will not pass its own tests does not get published,
      # but a branch that does not exist yet is not a failure.
      - uses: actions/checkout@v4
        id: native
        continue-on-error: true
        with:
          ref: native-3d
          path: src/native-3d

      - uses: actions/checkout@v4
        id: threejs
        continue-on-error: true
        with:
          ref: threejs-renderer
          path: src/threejs

      - name: Test every renderer that checked out
        run: |
          for dir in src/*/; do
            [ -f "$dir/package.json" ] || continue
            echo "== $dir"
            (cd "$dir" && npm test)
          done

      - name: Assemble the site
        run: |
          mkdir -p _site
          # main at the root, the rest in subfolders. .git goes nowhere near
          # the artifact.
          rsync -a --exclude '.git' src/main/ _site/
          for name in native-3d threejs; do
            [ -d "src/$name" ] || continue
            rsync -a --exclude '.git' "src/$name/" "_site/$name/"
          done
          find _site -name '.git' -prune -exec rm -rf {} +
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
